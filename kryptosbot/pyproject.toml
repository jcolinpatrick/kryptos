[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "internal"
version = "1.0.0"
description = "Multi-agent cryptanalytic framework for Kryptos K4 decipherment"
requires-python = ">=3.10"
dependencies = [
    "agent-sdk",
]

[project.scripts]
internal= "internal.orchestrator:Orchestrator"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
